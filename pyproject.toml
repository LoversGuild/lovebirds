[project]
name = "lovebirds"
version = "0.1.0"
description = "Event participation database management and messaging library for The Lovers’ Guild"
authors = [
    {name = "The Lovers’ Guild",email = "dev@loversguild.org"}
]
license = {text = "GPL-3.0-only"}
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml (>=6.0.3,<7.0.0)",
    "mashumaro (>=3.17,<4.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "typeguard (>=4.4.4,<5.0.0)",
    "types-pyyaml (>=6.0.12.20250915,<7.0.0.0)",
    "texttable (>=1.7.0,<2.0.0)"
]

[dependency-groups]
dev = [
    "black (>=25.9.0,<26.0.0)",
    "mypy (>=1.18.2,<2.0.0)",
    "deadcode (>=2.4.1,<3.0.0)",
    "pytest (>=8.0.0,<9.0.0)",
    "pytest-mock (>=3.14.0,<4.0.0)",
    "coverage[toml] (>=7.6.0,<8.0.0)"
]


[project.scripts]
lovebird = "lovebirds.cli.main:main"

[project.entry-points."typeguard.checker_lookup"]
lovebirds = "lovebirds.models.typecheck:dataclass_typechecker_lookup"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-markers", "--tb=short", "-q"]

[tool.coverage.run]
source = ["lovebirds"]
branch = true

[tool.coverage.report]
show_missing = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
